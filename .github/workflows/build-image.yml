name: 构建插件镜像

on:
  push:
    branches: [main]
    paths:
      - "whole_house_status/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 读取插件版本
        id: version
        run: |
          VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('whole_house_status/config.yaml'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: whole_house_status
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/to21github/whole-house-status:${{ steps.version.outputs.version }}
